
name: Update GitHub Profile

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. Verify required files
      - name: Check required files
        run: |
          test -f generate_profile.py
          test -f dark_mode_template.svg

      # 5. Generate updated SVG
      - name: Generate profile SVG
        run: python generate_profile.py

      # 6. Verify generated SVG
      - name: Verify generated SVG
        run: |
          test -f dark_mode.svg
          if grep -q "__AGE__\|__REPOSITORIES__" dark_mode.svg; then
            echo "Error: SVG still contains placeholders."
            exit 1
          fi

      # 7. Commit and push changes
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dark_mode.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub profile statistics"
            git push
          fi
